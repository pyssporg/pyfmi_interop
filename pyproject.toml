[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfmi-interop"
dynamic = ["version"]
description = "Turn SysML v2 FMU definitions into C++ realtime runtimes and one versioned wire format."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "pyssp contributors" }
]
keywords = [
  "fmi",
  "fmu",
    "sysml-v2",
    "realtime",
    "protobuf",
    "wire-format",
    "co-simulation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Simulation",
]
dependencies = []

[project.optional-dependencies]
# SysML ingestion is optional so the runtime/codegen path can be installed and
# tested without the SysML dialect packages.  Inside the pyssp workspace they
# are installed editable from the checkout, which shadows these release pins.
sysml = [
  "pycps-sysml2 @ https://github.com/pyssporg/pycps_sysml2/releases/download/v0.3.0/pycps_sysml2-0.3.0-py3-none-any.whl",
  "pyfmi-sysml2 @ https://github.com/pyssporg/pyfmi_sysml2/releases/download/v0.3.0/pyfmi_sysml2-0.3.0-py3-none-any.whl",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "build",
]

[project.scripts]
pyfmi-interop = "pyfmi_interop.cli:main"

[project.urls]
Documentation = "https://github.com/pyssporg/pyfmi_interop/tree/main/docs"
Source = "https://github.com/pyssporg/pyfmi_interop"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
pyfmi_interop = [
  "codegen/templates/*.in",
  "_runtime/*.a",
  "_runtime/*.lib",
  "_runtime/include/**/*.hpp",
  "_runtime/include/pyfmi_interop/transport/**/*.hpp",
]

[tool.setuptools.dynamic]
version = { attr = "pyfmi_interop.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyfmi_interop*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Lint selection is explicit so a ruff upgrade cannot change the gate.
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "static: inspects source or files without executing the package",
  "unit: one object's behaviour, no generated artifact",
  "component: a generated artifact is the unit under test",
  "contract: two directions must agree (IR round-trip, generated/runtime ABI)",
  "system: the CLI and the native build are driven end to end",
  "cpp: requires a working C++ toolchain and CMake",
  "slow: not part of the default CI subset",
]
