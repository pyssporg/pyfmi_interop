[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfmi-interop"
dynamic = ["version"]
description = "Turn an FMU interface specification into C++ realtime runtimes and one versioned wire format."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "pyssp contributors" }
]
keywords = [
  "fmi",
  "fmu",
    "realtime",
    "protobuf",
    "wire-format",
    "co-simulation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
    "pyfmi-interfaces>=0.5.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "build",
]

[project.scripts]
pyfmi-interop = "pyfmi_interop.cli:main"

[project.urls]
Documentation = "https://github.com/pyssporg/pyfmi_interop/tree/main/docs"
Source = "https://github.com/pyssporg/pyfmi_interop"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
pyfmi_interop = [
  "_runtime/*.a",
  "_runtime/*.lib",
  "_runtime/include/**/*.hpp",
  "_runtime/include/pyfmi_interop/transport/**/*.hpp",
]

[tool.setuptools.dynamic]
version = { attr = "pyfmi_interop.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyfmi_interop*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Lint selection is explicit so a ruff upgrade cannot change the gate.
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
  "static: inspects source or files without executing the package",
  "unit: one object's behaviour, no generated artifact",
  "component: a generated artifact is the unit under test",
  "contract: two directions must agree (IR round-trip, generated/runtime ABI)",
  "system: the CLI and the native build are driven end to end",
  "cpp: requires a working C++ toolchain and CMake",
  "sysml: reserved for suites that opt into SysML ingestion",
  "slow: not part of the default CI subset",
]
