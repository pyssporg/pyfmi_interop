name: wheels

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Build the native runtime first
        # setup.py refuses to build a wheel without build/runtime/.
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Install
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]"

      - name: Build wheel and sdist
        run: python -m build --wheel --sdist

      - name: Check artifacts
        run: |
          python - <<'PY'
          import pathlib
          import zipfile

          dist = pathlib.Path("dist")
          wheels = sorted(dist.glob("*.whl"))
          sdists = sorted(dist.glob("*.tar.gz"))
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists
          assert not any("0.0.0" in path.name for path in dist.iterdir()), list(dist.iterdir())

          wheel = wheels[0]
          assert wheel.name.endswith("-py3-none-linux_x86_64.whl"), wheel.name
          version = wheel.name.split("-", 1)[1].split("-", 1)[0]
          assert version != "0.0.0", wheel.name

          with zipfile.ZipFile(wheel) as zf:
              assert zf.testzip() is None
              names = zf.namelist()
              # A platform wheel installs package files under
              # <dist>.data/purelib/; accept either layout.
              assert any(
                  name.endswith(
                      "pyfmi_interop/_runtime/libpyfmi_interop_runtime.a"
                  )
                  for name in names
              ), "native runtime missing from the wheel"
              assert any(
                  "_runtime/include/" in name and name.endswith(".hpp")
                  for name in names
              ), "runtime headers missing from the wheel"
              metadata = next(
                  name for name in names
                  if name.endswith(".dist-info/METADATA")
              )
              text = zf.read(metadata).decode()
          assert "Name: pyfmi-interop" in text, text
          assert f"Version: {version}" in text, text

          sdist_version = sdists[0].name.removeprefix("pyfmi_interop-").removesuffix(".tar.gz")
          assert sdist_version == version, (sdists[0].name, version)
          print(wheel.name)
          PY

      - name: Check the version tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(python -c 'import pyfmi_interop; print(pyfmi_interop.__version__)')"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyfmi_interop.__version__ ${version}." >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
