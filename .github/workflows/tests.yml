name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Configure native runtime
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build native runtime
        run: cmake --build build

      - name: Native tests
        run: ctest --test-dir build --output-on-failure

      - name: Install
        # The editable install needs the native runtime built above.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Tests
        run: python -m pytest -m "not slow"

      - name: Tests leave the checkout clean
        run: git diff --exit-code && test -z "$(git status --porcelain)"
